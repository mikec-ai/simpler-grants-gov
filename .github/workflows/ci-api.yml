name: API Checks

on:
  workflow_call:
    inputs:
      skip_checks:
        type: boolean
        default: false
        description: Skip the guts of this workflow, but we have to run the workflow for dependency reasons when calling from CD workflows
  pull_request:
    paths:
      - api/**
      - .github/workflows/ci-api.yml

defaults:
  run:
    working-directory: ./api

jobs:
  classify-form-spec-change:
    if: ${{ inputs.skip_checks == null || inputs.skip_checks == false }}
    name: Classify portable form change
    runs-on: ubuntu-22.04
    outputs:
      bank_only: ${{ steps.classify.outputs.bank_only }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 0

      - name: Select CI tier
        id: classify
        working-directory: ./
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "bank_only=false" >> "$GITHUB_OUTPUT"
            echo "reason=non-PR invocation requires full CI" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PYTHONPATH=api python3 api/bin/check_form_spec_bank.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  lint-test:
    needs: [classify-form-spec-change]
    if: ${{ (inputs.skip_checks == null || inputs.skip_checks == false) && needs.classify-form-spec-change.outputs.bank_only != 'true' }}
    name: API Lint, Format & Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Initialize the docker containers
        run: make init

      - name: Run format check
        run: make format-check

      - name: Run linting
        run: make lint

      - name: Check migrations up-to-date
        run: make db-check-migrations

      - name: Run security linting
        run: make lint-security

      - name: Start tests
        run: make test-coverage

  portable-form-bank:
    needs: [classify-form-spec-change]
    if: ${{ needs.classify-form-spec-change.outputs.bank_only == 'true' }}
    name: Portable Form Bank Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Lightweight bank checks passed
        working-directory: ./
        run: echo "Artifact integrity, exact-XSD pins, and additive-selection checks passed."

  skip-checks:
    if: ${{ inputs.skip_checks != null && inputs.skip_checks == true }}
    name: Skip Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checks skipped
        working-directory: ./
        run: exit 0
