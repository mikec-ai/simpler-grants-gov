name: API Checks

on:
  workflow_call:
    inputs:
      skip_checks:
        type: boolean
        default: false
        description: Skip the guts of this workflow, but we have to run the workflow for dependency reasons when calling from CD workflows
  pull_request:
    paths:
      - api/**
      - .github/workflows/ci-api.yml

defaults:
  run:
    working-directory: ./api

jobs:
  classify-form-spec-change:
    if: ${{ inputs.skip_checks == null || inputs.skip_checks == false }}
    name: Classify portable form change
    runs-on: ubuntu-22.04
    outputs:
      bank_only: ${{ steps.classify.outputs.bank_only }}
      tier: ${{ steps.classify.outputs.tier }}
      portable_form_ids: ${{ steps.classify.outputs.portable_form_ids }}
      portable_test_files: ${{ steps.classify.outputs.portable_test_files }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 0

      - name: Select CI tier
        id: classify
        working-directory: ./
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            {
              echo "bank_only=false"
              echo "tier=full"
              echo "portable_form_ids="
              echo "portable_test_files="
              echo "reason=non-PR invocation requires full CI"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PYTHONPATH=api python3 api/bin/check_form_spec_bank.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  lint-test:
    needs: [classify-form-spec-change]
    if: ${{ (inputs.skip_checks == null || inputs.skip_checks == false) && needs.classify-form-spec-change.outputs.tier == 'full' }}
    name: API Lint, Format & Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Test API readiness helper
        run: bash tests/bin/test_wait_for_api.sh

      - name: Initialize the docker containers
        run: make init

      - name: Run format check
        run: make format-check

      - name: Run linting
        run: make lint

      - name: Check migrations up-to-date
        run: make db-check-migrations

      - name: Run security linting
        run: make lint-security

      - name: Start tests
        run: make test-coverage

      - name: Build portable-versus-existing differential receipts
        run: |
          TESTED_REVISION="$(git rev-parse HEAD)"
          docker compose run -T --rm grants-api \
            python bin/build_portable_legacy_differential.py \
            --consumer-revision "$TESTED_REVISION" \
            --pr-head-revision "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output-dir /api/test-results/legacy-differential

      - name: Publish portable-versus-existing differential receipts
        uses: actions/upload-artifact@v7
        with:
          name: portable-legacy-differential-${{ github.sha }}
          path: api/test-results/legacy-differential/
          if-no-files-found: error

  portable-form-bank:
    needs: [classify-form-spec-change]
    if: ${{ needs.classify-form-spec-change.outputs.bank_only == 'true' }}
    name: Portable Form Bank Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Lightweight bank checks passed
        working-directory: ./
        run: echo "Artifact integrity, exact-XSD pins, and additive-selection checks passed."

  portable-form-focused:
    needs: [classify-form-spec-change]
    if: ${{ needs.classify-form-spec-change.outputs.tier == 'portable_focused' }}
    name: Focused Portable Form Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Initialize the docker containers
        run: make init

      - name: Run format and Ruff checks
        run: |
          make format-check
          make lint-ruff

      - name: Run portable catalog and exact form tests
        env:
          PORTABLE_TEST_FILES: ${{ needs.classify-form-spec-change.outputs.portable_test_files }}
        run: |
          IFS=',' read -ra test_files <<< "$PORTABLE_TEST_FILES"
          for path in "${test_files[@]}"; do
            if [[ ! "$path" =~ ^api/tests/src/form_schema/form_spec/test_[a-z0-9_]+\.py$ ]]; then
              echo "invalid focused portable test path: $path" >&2
              exit 2
            fi
          done
          # The complete portable catalog suite catches cross-form invariants,
          # including global-bundle provenance advancing independently of an
          # individual form's pinned producer revision.
          docker compose run -T --rm grants-api pytest tests/src/form_schema/form_spec

      - name: Build exact portable-versus-existing differential receipts
        env:
          PORTABLE_FORM_IDS: ${{ needs.classify-form-spec-change.outputs.portable_form_ids }}
        run: |
          IFS=',' read -ra form_ids <<< "$PORTABLE_FORM_IDS"
          differential_args=()
          for form_id in "${form_ids[@]}"; do
            differential_args+=(--form-id "$form_id")
          done
          TESTED_REVISION="$(git rev-parse HEAD)"
          docker compose run -T --rm grants-api \
            python bin/build_portable_legacy_differential.py \
            --consumer-revision "$TESTED_REVISION" \
            --pr-head-revision "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output-dir /api/test-results/legacy-differential \
            "${differential_args[@]}"
          selected_count="${#form_ids[@]}"
          outcome_count="$(jq '.oracleReceipts + .noOracleDispositions' test-results/legacy-differential/summary.json)"
          [[ "$selected_count" -eq "$outcome_count" ]]

      - name: Publish exact portable-versus-existing differential receipts
        uses: actions/upload-artifact@v7
        with:
          name: portable-legacy-differential-${{ github.sha }}
          path: api/test-results/legacy-differential/
          if-no-files-found: error

  skip-checks:
    if: ${{ inputs.skip_checks != null && inputs.skip_checks == true }}
    name: Skip Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checks skipped
        working-directory: ./
        run: exit 0
