services:
  grants-api:
    # Hosted browser checks run an immutable checkout. Avoid the development
    # reloader's extra process and second full application import in that path.
    command:
      [
        "flask",
        "--app",
        "src.app",
        "run",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--no-reload",
      ]
    environment:
      # The hosted browser stack is deliberately single-process, so start the
      # local scanner without relying on Werkzeug's reloader-child marker.
      LOCAL_FILE_SCANNER_RUN_WITHOUT_RELOADER: "TRUE"
